name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Installer integration test
        run: |
          swift build -c release
          python3 Tests/Integration/config_test.py
      - name: Localization test
        run: python3 Tests/Integration/localization_test.py
      - name: Package app, disk image, and zip (ad-hoc signed, not distributed)
        run: scripts/package.sh 0.0.0
